<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pastrimi">
<title>Flower Hotel — Pastrimi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--bg:#0a1628;--card:#0f2040;--border:#1a3358;--gold:#c9a84c;--gold2:#e8c96d;
      --text:#e8eaf6;--muted:#6b7fa3;--green:#22c55e;--red:#ef4444;--blue:#3b82f6;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:var(--bg);color:var(--text);min-height:100vh;}

/* HEADER */
.hdr{background:var(--card);border-bottom:1px solid var(--border);
      padding:0 14px;height:48px;display:flex;align-items:center;gap:10px;
      position:sticky;top:0;z-index:100;}
.hdr-logo{width:30px;height:30px;border-radius:6px;background:var(--bg);
           overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.hdr-logo img{width:100%;height:100%;object-fit:contain;filter:invert(1) brightness(2);}
.hdr-title{font-size:14px;font-weight:700;color:var(--gold);flex:1;}
.hdr-sub{font-size:10px;color:var(--muted);}

/* BUILDING TABS */
.bld-tabs{background:var(--card);border-bottom:1px solid var(--border);
           display:flex;overflow-x:auto;}
.bld-tabs::-webkit-scrollbar{display:none;}
.bld-tab{padding:11px 18px;font-size:12px;font-weight:600;cursor:pointer;
          border-bottom:2px solid transparent;color:var(--muted);
          display:flex;align-items:center;gap:5px;white-space:nowrap;
          background:none;border-top:none;border-left:none;border-right:none;}
.bld-tab.active{color:var(--gold);border-bottom-color:var(--gold);}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;}

/* STATS */
.stats-row{display:flex;padding:10px 14px;background:var(--card);
            border-bottom:1px solid var(--border);flex-wrap:wrap;}
.stat{padding:0 16px 0 0;border-right:1px solid var(--border);
       margin-right:16px;flex-shrink:0;}
.stat:last-child{border-right:none;}
.stat-n{font-size:20px;font-weight:800;line-height:1;}
.stat-l{font-size:9px;color:var(--muted);text-transform:uppercase;
         letter-spacing:.5px;margin-top:2px;}

/* FLOOR */
.floor-section{padding:10px 12px 0;}
.floor-title{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:1px;
               text-transform:uppercase;margin-bottom:7px;
               padding-bottom:5px;border-bottom:1px solid var(--border);}

/* CARD GRID */
.card-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px;}
.room-card{border-radius:10px;padding:10px 5px;text-align:center;
            cursor:pointer;user-select:none;transition:transform .12s,filter .1s;}
.room-card:active{transform:scale(.92);}
.room-card.pas{background:var(--green);}
.room-card.pis{background:var(--red);}
.room-card.oot{background:#6b7a8d;}
.rc-n{font-size:16px;font-weight:700;color:#fff;line-height:1;}
.rc-l{font-size:9px;color:rgba(255,255,255,.85);margin-top:3px;}
.rc-t{font-size:9px;color:rgba(255,255,255,.65);margin-top:1px;}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:800;display:none;align-items:center;justify-content:center;padding:16px;}
.modal-bg.open{display:flex;}
.modal-box{background:#fff;border-radius:20px;padding:28px 22px 22px;width:100%;max-width:360px;position:relative;}
.modal-close{position:absolute;top:16px;right:18px;background:none;border:none;font-size:22px;color:#aaa;cursor:pointer;line-height:1;}
.modal-title{font-size:20px;font-weight:800;color:#111;margin-bottom:2px;}
.modal-sub{font-size:13px;color:#888;margin-bottom:18px;}
.modal-btn{width:100%;padding:15px;border-radius:12px;font-size:15px;font-weight:700;border:3px solid transparent;cursor:pointer;margin-bottom:10px;transition:border-color .12s;}
.modal-btn.green{background:#22c55e;color:#fff;}
.modal-btn.red{background:#ef4444;color:#fff;}
.modal-btn.gray{background:#9ca3af;color:#fff;}
.modal-btn.sel{border-color:#111;}
.modal-notes{width:100%;border:1.5px solid #e5e7eb;border-radius:10px;padding:12px;font-size:14px;resize:none;outline:none;margin-bottom:16px;font-family:inherit;color:#111;}
.modal-notes:focus{border-color:#374151;}
.modal-actions{display:flex;gap:10px;}
.modal-anulo{flex:1;padding:14px;border-radius:10px;background:#f3f4f6;color:#374151;border:none;font-size:14px;font-weight:600;cursor:pointer;}
.modal-ruaj{flex:1;padding:14px;border-radius:10px;background:#111;color:#fff;border:none;font-size:14px;font-weight:700;cursor:pointer;}

/* LOADING */
#overlay{position:fixed;inset:0;background:rgba(10,22,40,.85);
          display:flex;align-items:center;justify-content:center;z-index:999;}
.spinner{width:36px;height:36px;border:3px solid var(--border);
          border-top-color:var(--gold);border-radius:50%;
          animation:spin .75s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{color:var(--muted);margin-top:12px;font-size:13px;}

/* SYNC TOAST */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
        background:var(--card);border:1px solid var(--border);border-radius:8px;
        padding:8px 18px;font-size:12px;color:var(--gold);display:none;z-index:500;}

/* BOTTOM BAR */
.bot-bar{padding:12px 14px;background:var(--card);border-top:1px solid var(--border);
          display:flex;align-items:center;justify-content:space-between;
          position:sticky;bottom:0;}
.bot-date{font-size:11px;color:var(--muted);}
.bot-close{background:#c9a84c;border:none;color:#1a1400;font-size:13px;
            padding:10px 24px;border-radius:7px;cursor:pointer;font-weight:700;
            letter-spacing:.3px;}
.bot-close:active{opacity:.8;}

/* RESPONSIVE */
@media(max-width:380px){
  .card-grid{grid-template-columns:repeat(4,1fr);}
  .rc-n{font-size:14px;}
}
</style>
</head>
<body>

<div id="overlay">
  <div style="text-align:center">
    <div class="spinner"></div>
    <div class="loading-txt">Duke ngarkuar...</div>
  </div>
</div>
<div id="toast"></div>

<div class="hdr">
  <div class="hdr-logo">
    <img src="/logo.png" alt="Flower Hotel" onerror="this.style.display='none'">
  </div>
  <div>
    <div class="hdr-title">FLOWER HOTEL</div>
    <div class="hdr-sub">Sistemi i Pastrimit</div>
  </div>
</div>

<div class="bld-tabs">
  <button class="bld-tab active" id="tf" onclick="switchBld('flower')">
    <span class="dot" style="background:#ef4444"></span>Flower Hotel
  </button>
  <button class="bld-tab" id="tg" onclick="switchBld('garden')">
    <span class="dot" style="background:#22c55e"></span>Garden Hotel
  </button>
</div>

<div class="stats-row" id="stats"></div>
<div id="cards" style="padding-bottom:70px;"></div>

<!-- MODAL -->
<div class="modal-bg" id="modal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-sub" id="modal-sub"></div>
    <button class="modal-btn green" id="mbtn-pas" onclick="selectClean('paster')">E Pastër</button>
    <button class="modal-btn red" id="mbtn-pis" onclick="selectClean('piseet')">E Pisët</button>
    <button class="modal-btn gray" id="mbtn-oot" onclick="selectClean('oot')">Out of Order</button>
    <textarea class="modal-notes" id="modal-notes" rows="3" placeholder="Shënime..."></textarea>
    <div class="modal-actions">
      <button class="modal-anulo" onclick="closeModal()">Anulo</button>
      <button class="modal-ruaj" onclick="saveModal()">Ruaj ✓</button>
    </div>
  </div>
</div>

<div class="bot-bar">
  <span class="bot-date" id="bot-date"></span>
  <button class="bot-close" onclick="closeDayConfirm()">Mbyll Ditën ✓</button>
</div>

<script>
'use strict';

const INV={
  flower:{
    'Kati 1':['101','102','103','104','105','106','107','108','109','110','111','112','113','114','115','116','117','118','119','120','121','122','123','124'],
    'Kati 2':['201','202','203','204','205','206','207','208','209','210','211','212','213','214','215','216','217','218','219','220','221','222','223','224'],
    'Kati 3':['301','302','303','304','305','306','307','308','309','310','311','312','313','314','315','316','317','318','319','320','321','322','323','324'],
    'Kati 4':['401','402','403','404','405','406','407','408','409','410','411','412','413','414','415','416','417','418','419','420','421','422','423','424'],
    'Kati 5':['501','502','503','504','505','506','507','508','509','510','511','512','513','514','515','516','517','518','519','520','521','522','523','524'],
    'Vilat':['VILA 1','VILA 2']
  },
  garden:{
    'Kati 1':['G101','G102','G103','G104','G105','G106','G107','G108','G109','G110','G111','G112','G114','G115'],
    'Kati 2':['G201','G202','G203','G204','G205','G206','G207','G208','G209','G210','G211','G212','G214','G215'],
    'Kati 3':['G301','G302','G303','G304','G305','G306','G307','G308','G309','G310','G311','G312','G314','G315']
  }
};

let bld='flower', rooms={};

function initRooms(){
  for(const[b,floors] of Object.entries(INV))
    for(const[fl,nums] of Object.entries(floors))
      for(const num of nums){
        const k=`${b}-${num}`;
        if(!rooms[k]) rooms[k]={num,bld:b,fl,status:'liree',clean:'piseet',persons:'',checkin:'',checkout:'',notes:'',ts:null};
      }
}

const DAYS=['E Diel','E Hënë','E Martë','E Mërkurë','E Enjte','E Premte','E Shtunë'];
const MONS=['Janar','Shkurt','Mars','Prill','Maj','Qershor','Korrik','Gusht','Shtator','Tetor','Nëntor','Dhjetor'];
function dateAlb(d){return`${DAYS[d.getDay()]}, ${d.getDate()} ${MONS[d.getMonth()]} ${d.getFullYear()}`;}
function nowHM(){const d=new Date();return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}

function switchBld(b){
  bld=b;
  document.getElementById('tf').className='bld-tab'+(b==='flower'?' active':'');
  document.getElementById('tg').className='bld-tab'+(b==='garden'?' active':'');
  render();
}

function computeStats(){
  const rs=Object.values(rooms).filter(r=>r.bld===bld);
  return{
    total:rs.length,
    paster:rs.filter(r=>r.clean==='paster').length,
    piseet:rs.filter(r=>r.clean==='piseet').length,
    oot:rs.filter(r=>r.clean==='oot').length
  };
}

function render(){
  const s=computeStats();
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="stat-n" style="color:var(--text)">${s.total}</div><div class="stat-l">Total</div></div>
    <div class="stat"><div class="stat-n" style="color:var(--green)">${s.paster}</div><div class="stat-l">E Pastër</div></div>
    <div class="stat"><div class="stat-n" style="color:var(--red)">${s.piseet}</div><div class="stat-l">E Pisët</div></div>
    <div class="stat"><div class="stat-n" style="color:#9ca3af">${s.oot}</div><div class="stat-l">Out of Order</div></div>`;
  document.getElementById('bot-date').textContent=dateAlb(new Date());
  const floors=INV[bld];
  let html='';
  for(const[fl,nums] of Object.entries(floors)){
    html+=`<div class="floor-section"><div class="floor-title">${fl}</div><div class="card-grid">`;
    for(const num of nums){
      const k=`${bld}-${num}`,room=rooms[k];if(!room)continue;
      const cls=room.clean==='paster'?'pas':room.clean==='oot'?'oot':'pis';
      const lbl=room.clean==='paster'?'E Pastër':room.clean==='oot'?'Out of Order':'E Pisët';
      html+=`<div class="room-card ${cls}" onclick="openModal('${k}')">
        <div class="rc-n">${num}</div>
        <div class="rc-l">${lbl}</div>
        <div class="rc-t">${room.ts||'––:––'}</div>
      </div>`;
    }
    html+='</div></div>';
  }
  document.getElementById('cards').innerHTML=html;
}

let _modalKey=null,_modalClean=null;

function openModal(k){
  const room=rooms[k];if(!room)return;
  _modalKey=k;_modalClean=room.clean||'piseet';
  document.getElementById('modal-title').textContent='Dhoma '+room.num;
  document.getElementById('modal-sub').textContent=room.bld==='flower'?'Flower Hotel':'Garden Hotel';
  document.getElementById('modal-notes').value=room.notes||'';
  updateModalBtns();
  document.getElementById('modal').classList.add('open');
}

function selectClean(val){_modalClean=val;updateModalBtns();}

function updateModalBtns(){
  document.getElementById('mbtn-pas').className='modal-btn green'+(_modalClean==='paster'?' sel':'');
  document.getElementById('mbtn-pis').className='modal-btn red'+(_modalClean==='piseet'?' sel':'');
  document.getElementById('mbtn-oot').className='modal-btn gray'+(_modalClean==='oot'?' sel':'');
}

function closeModal(){
  document.getElementById('modal').classList.remove('open');
  _modalKey=null;_modalClean=null;
}

async function saveModal(){
  if(!_modalKey)return;
  const room=rooms[_modalKey];
  room.clean=_modalClean;
  room.notes=document.getElementById('modal-notes').value;
  room.ts=nowHM();
  closeModal();render();
  await push();
}

async function push(){
  try{
    await fetch('/api/hms/state',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({state:rooms})
    });
  }catch(e){console.warn('[HK] push:',e.message);}
}

async function pull(){
  try{
    const res=await fetch('/api/hms/state');
    const data=await res.json();
    if(data&&data.data&&Object.keys(data.data).length>0)
      for(const[k,v] of Object.entries(data.data))
        if(rooms[k])Object.assign(rooms[k],v);
  }catch(e){console.warn('[HK] pull:',e.message);}
}

function showToast(msg,duration=3000){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.display='block';
  setTimeout(()=>{t.style.display='none';},duration);
}

async function closeDayConfirm(){
  if(!confirm('Po dërgoni raportin final të pastrimit tek recepsioni.\nKonfirmoni?'))return;
  showToast('⏳ Duke dërguar...',10000);
  try{
    const r=await fetch('/api/hms/close-day',{
      method:'POST',headers:{'Content-Type':'application/json'}
    });
    const d=await r.json();
    if(d.ok) showToast('✅ Raporti u dërgua me sukses!');
    else showToast('⚠ '+(d.error||'Gabim në dërgim'));
  }catch(e){
    showToast('⚠ Gabim lidhje me serverin');
  }
}

// Auto-refresh çdo 60 sekonda
setInterval(()=>pull().then(render),60000);

// INIT
initRooms();
pull().then(()=>{render();document.getElementById('overlay').style.display='none';});
</script>
</body>
</html>
